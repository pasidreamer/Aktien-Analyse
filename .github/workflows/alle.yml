name: Ampeln und Alarme für alle Firmen

# Jeden Börsentag nach US-Schluss (nach «Kurse aktualisieren»): Q/T-Ampel für alle Firmen aus «Entdecken»
# und Push-Nachrichten bei neuen Signalen.
on:
  schedule:
    - cron: "10 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alle
  cancel-in-progress: false

jobs:
  rechne:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ampeln rechnen
        run: python scripts/alle.py --teil ${{ matrix.teil }} --von 6
      - uses: actions/upload-artifact@v4
        with:
          name: alle-${{ matrix.teil }}
          path: data/alle_teile/teil_${{ matrix.teil }}.json

  zusammen:
    needs: rechne
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: alle-*
          path: data/alle_teile
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alarme prüfen und senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/alle.py --zusammen
      - name: Speichern
        run: |
          git config user.name "aktien-ampel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alle.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Ampeln alle Firmen $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs
            git push
          fi
      - run: rm -rf data/alle_teile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
