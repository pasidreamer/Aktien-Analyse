name: Karussell posten
# Jeden Tag um ca. 07:30 Uhr (Zürich) das Karussell von heute auf Instagram und TikTok posten.
# Der Reel dazu geht abends um ca. 18:00 raus (Workflow «Reel posten»). Von Hand gestartet (workflow_dispatch)
# postet dieser Workflow für das gewählte Datum alles, was noch fehlt, auch den Reel.
#
# Auslöser, damit es sicher klappt (GitHub lässt geplante Läufe manchmal stundenlang liegen oder ganz aus):
#  1. Sobald das Karussell gerendert ist (Workflow «Instagram-Karussell rendern»): Lauf wartet bis 07:30 und postet.
#  2. Ersatz: Zeitplan alle 30 Minuten zwischen ca. 06:30 und 12:00 Uhr. posten.py postet nur zwischen 07:00 und
#     15:00 Uhr und nie zweimal (data/karussell/gepostet.json), überzählige Läufe tun also nichts.
on:
  workflow_run:
    workflows: ["Instagram-Karussell rendern"]
    types: [completed]
  schedule:
    - cron: "29,59 5-10 * * *"
  workflow_dispatch:
    inputs:
      trocken:
        description: "Nur testen, nichts posten (der Reel wird trotzdem gebaut und als Download angehängt)"
        type: boolean
        default: true
      datum:
        description: "Datum JJJJ-MM-TT (leer = heute)"
        required: false

permissions:
  contents: write

concurrency:
  group: karussell-posten
  cancel-in-progress: false

jobs:
  posten:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bis 07:30 warten (nur nach dem Rendern)
        if: github.event_name == 'workflow_run'
        run: |
          ziel=$(TZ=Europe/Zurich date -d "07:30" +%s)
          jetzt=$(date +%s)
          if [ "$jetzt" -lt "$ziel" ]; then
            echo "Warte $(( (ziel - jetzt) / 60 )) Minuten bis 07:30 Uhr Zürich."
            sleep $(( ziel - jetzt ))
          fi
          git pull -q origin main
      - name: Schon gepostet?
        id: offen
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import datetime, json, zoneinfo
          heute = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Zurich")).date().isoformat()
          try:
              e = json.load(open("data/karussell/gepostet.json", encoding="utf-8"))["posts"].get(heute, {})
          except (OSError, ValueError, KeyError):
              e = {}
          print("fertig=" + ("ja" if "id" in e.get("instagram", {}) else "nein"))
          EOF
      - name: Werkzeuge für den Reel (nur bei Start von Hand)
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install numpy playwright
          # Google Chrome ist auf dem GitHub-Rechner vorinstalliert; nur falls nicht, Chromium nachladen
          if command -v google-chrome >/dev/null; then echo "PW_KANAL=chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Posten
        if: steps.offen.outputs.fertig != 'ja' || github.event_name == 'workflow_dispatch'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODUS: ${{ vars.TIKTOK_MODUS || 'entwurf' }}
          REEL: ${{ vars.REEL || 'an' }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TROCKEN: ${{ inputs.trocken }}
          DATUM: ${{ inputs.datum }}
        run: |
          args=""
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then args="--ab-7-uhr --ohne instagram_reel"; fi
          if [ "$TROCKEN" = "true" ]; then args="$args --trocken"; fi
          if [ -n "$DATUM" ]; then args="$args --datum $DATUM"; fi
          python scripts/posten.py $args
      - name: Reel als Download anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: karussell/*/reel.mp4
          if-no-files-found: ignore
          retention-days: 14
      - name: Protokoll speichern
        if: always()
        run: |
          git config user.name "aktien-ampel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/karussell/gepostet.json 2>/dev/null || exit 0
          if ! git diff --cached --quiet; then
            git commit -m "Karussell gepostet $(TZ=Europe/Zurich date +%F)"
            git pull --rebase -X theirs
            git push
          fi
