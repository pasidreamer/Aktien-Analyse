name: Karussell posten
# Jeden Tag um ca. 07:30 Uhr (Zürich) das Karussell von heute auf Instagram und TikTok posten.
# Zwei Startzeiten in UTC, damit es bei Sommer- und Winterzeit stimmt; posten.py postet nur ab 7 Uhr
# und nie zweimal (data/karussell/gepostet.json). GitHub startet geplante Läufe teils einige Minuten später.
on:
  schedule:
    - cron: "20 5,6 * * *"
  workflow_dispatch:
    inputs:
      trocken:
        description: "Nur testen, nichts posten"
        type: boolean
        default: true
      datum:
        description: "Datum JJJJ-MM-TT (leer = heute)"
        required: false

permissions:
  contents: write

concurrency:
  group: karussell-posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posten
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODUS: ${{ vars.TIKTOK_MODUS || 'entwurf' }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TROCKEN: ${{ inputs.trocken }}
          DATUM: ${{ inputs.datum }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "schedule" ]; then args="--ab-7-uhr"; fi
          if [ "$TROCKEN" = "true" ]; then args="$args --trocken"; fi
          if [ -n "$DATUM" ]; then args="$args --datum $DATUM"; fi
          python scripts/posten.py $args
      - name: Protokoll speichern
        if: always()
        run: |
          git config user.name "aktien-ampel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/karussell/gepostet.json 2>/dev/null || exit 0
          if ! git diff --cached --quiet; then
            git commit -m "Karussell gepostet $(TZ=Europe/Zurich date +%F)"
            git pull --rebase -X theirs
            git push
          fi
