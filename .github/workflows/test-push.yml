name: Test-Benachrichtigung

# Schickt eine Testnachricht ans Handy und prüft, ob das Secret NTFY_TOPIC stimmt.
on:
  workflow_dispatch:
    inputs:
      thema:
        description: "Thema, das in der ntfy-App abonniert ist (leer = nur Secret verwenden)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testnachricht senden und Secret prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THEMA: ${{ inputs.thema }}
        run: |
          ziel="${THEMA:-$NTFY_TOPIC}"
          if [ -z "$ziel" ]; then
            echo "::error::Secret NTFY_TOPIC fehlt."
            exit 1
          fi
          curl -sS --fail \
            -H "Title: =?UTF-8?B?$(printf 'Aktien-Ampel: Test erfolgreich' | base64 -w0)?=" \
            -H "Tags: white_check_mark" \
            -H "Click: https://pasidreamer.github.io/Aktien-Analyse/" \
            -d "Die Push-Nachrichten kommen auf deinem Handy an." \
            "https://ntfy.sh/$ziel"
          if [ -n "$THEMA" ] && [ "$THEMA" != "$NTFY_TOPIC" ]; then
            echo "::error::Das Secret NTFY_TOPIC ist NICHT gleich wie das Thema in der ntfy-App."
            exit 1
          fi
          echo "Alles stimmt."
