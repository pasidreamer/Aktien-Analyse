name: Kurse aktualisieren

on:
  schedule:
    # Montag bis Freitag nach US-Börsenschluss (22:40 UTC)
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse holen und Ampeln berechnen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update.py
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-ampel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json data/verlauf.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Kurse aktualisiert $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
