name: App veröffentlichen

# Läuft, wenn neue Analysen oder App-Änderungen hochgeladen werden.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ampeln mit aktuellen Daten neu berechnen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update.py || echo "Kursdaten nicht erreichbar, App wird trotzdem veröffentlicht"
      - name: Ergebnis speichern
        run: |
          git config user.name "aktien-ampel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json data/verlauf.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Kurse aktualisiert $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
