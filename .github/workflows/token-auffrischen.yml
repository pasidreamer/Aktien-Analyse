name: Social-Media-Zugang erneuern
# Jeden Montag: Instagram-Token (60 Tage) und TikTok-Refresh-Token (365 Tage) verlängern.
on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:

concurrency:
  group: social-token
  cancel-in-progress: false

jobs:
  erneuern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Erneuern
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/token_auffrischen.py
